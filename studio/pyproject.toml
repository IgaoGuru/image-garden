[project]
name = "constellation-studio"
version = "0.1.0"
description = "Local tools for generating and serving CLIP image embeddings for Constellation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "open-clip-torch>=3.0.0",
    "pillow>=11.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[project.scripts]
constellation-embed = "constellation_studio.embed:main"
constellation-serve = "constellation_studio.server:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31.4",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # formatter owns trailing commas
    "D100",  # small internal tool, docstrings not useful everywhere
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "E501",  # embedded HTML has long lines
    "EM101",
    "EXE001", # wrappers can still be run as python studio/embed.py
    "PLC0415", # lazy ML imports keep non-ML commands fast
    "PLR2004",
    "PT017",
    "S101",  # pytest assert
    "T201",  # CLI output uses print intentionally
    "TC003", # pathlib/collections imports are harmless at runtime
    "TRY003",
    "TRY004",
]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests", "embed.py", "serve.py"]
exclude = ["src/constellation_studio/open_clip_backend.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
